name: Sincronizar com o Notion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
    steps:
      - name: Secrets não configurados
        if: env.NOTION_TOKEN == '' || env.NOTION_PAGE_ID == ''
        run: echo "Cadastre NOTION_TOKEN e NOTION_PAGE_ID em Settings > Secrets and variables > Actions."

      - uses: actions/checkout@v7
        if: env.NOTION_TOKEN != '' && env.NOTION_PAGE_ID != ''

      - uses: actions/setup-node@v7
        if: env.NOTION_TOKEN != '' && env.NOTION_PAGE_ID != ''
        with:
          node-version: 22

      - name: Instalar dependências
        if: env.NOTION_TOKEN != '' && env.NOTION_PAGE_ID != ''
        run: npm install

      - name: Sincronizar
        if: env.NOTION_TOKEN != '' && env.NOTION_PAGE_ID != ''
        run: npm run sync

      - name: Commit e push
        if: env.NOTION_TOKEN != '' && env.NOTION_PAGE_ID != ''
        run: |
          git config user.name "notion-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Sem alterações" && exit 0
          git commit -m "docs: sincroniza com o Notion"
          git push origin main
